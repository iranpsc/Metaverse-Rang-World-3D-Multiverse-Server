// File => protos/realtime/realtime_stream.proto

syntax = "proto3";

//* این پکیج مسیر نام‌گذاری سرویس جی‌آر‌پی‌سی ریل‌تایم را مشخص می‌کند.
package metaverse.v1.realtime;

//* این سرویس کانال جی‌آر‌پی‌سی اِستریم ریل‌تایم را تعریف می‌کند.
service RealtimeStreamService {
  //* این آرپی‌سی یک اِستریم دوطرفه باز می‌کند تا کلاینت و سرور پیام‌های ریل‌تایم را پشت سر هم رد و بدل کنند.
  rpc Open(stream RealtimeRawJson) returns (stream RealtimeRawJson);
}

//* این پیام فقط جیسون خام اِنولوپ فعلی ریل‌تایم را حمل می‌کند.
message RealtimeRawJson {
  //* این فیلد متن خام جیسون همان اِنولوپ فعلی پروژه است.
  string rawJson = 1;
}

//* توضیح کلی فایل:
//* این فایل قرارداد جی‌آر‌پی‌سی اِستریم ریل‌تایم را تعریف می‌کند.
//* نقش این فایل فقط باز کردن مسیر انتقال دوطرفه بین کلاینت نیتیو و سرور است.
//* پیام‌های ریل‌تایم داخل فیلد rawJson عبور می‌کنند.
//* پردازش اصلی پیام‌ها بعداً در ترنسپورت و کُر ریل‌تایم انجام می‌شود.