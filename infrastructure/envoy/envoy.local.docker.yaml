static_resources:
  listeners:
    - name: listener_https
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8443
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/certs/server.crt
                    private_key:
                      filename: /etc/envoy/certs/server.key
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_https

                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: grpc_backend
                      domains:
                        - "*"
                      cors:
                        allow_origin_string_match:
                          - exact: "http://localhost:3000"
                          - exact: "http://127.0.0.1:3000"
                          - exact: "http://localhost:3001"
                          - exact: "http://127.0.0.1:3001"
                        allow_methods: "GET, POST, OPTIONS"
                        allow_headers: "content-type,x-grpc-web,x-user-agent,grpc-timeout,authorization,x-metaverse-client,x-client-platform,x-client-version,x-requested-with,accept,origin,priority,x-metaverse-version"
                        expose_headers: "grpc-status,grpc-message,grpc-status-details-bin"
                        max_age: "1728000"
                      routes:
                        - match:
                            prefix: "/metaverse.v1.AuthService/"
                          route:
                            cluster: grpc_backend
                            timeout: 0s
                            max_stream_duration:
                              grpc_timeout_header_max: 0s

                        - match:
                            prefix: "/metaverse.v1.HealthService/"
                          route:
                            cluster: grpc_backend
                            timeout: 0s
                            max_stream_duration:
                              grpc_timeout_header_max: 0s

                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        access_jwt:
                          issuer: "metaverse"
                          audiences:
                            - "metaverse-client"
                          forward: true
                          remote_jwks:
                            http_uri:
                              uri: "http://host.docker.internal:8080/.well-known/jwks.json"
                              cluster: jwks_cluster
                              timeout: 5s
                            cache_duration:
                              seconds: 300
                      rules:
                        - match:
                            prefix: "/metaverse.v1.AuthService/GetUserData"
                          requires:
                            provider_name: access_jwt

                        - match:
                            prefix: "/metaverse.v1.AuthService/LogoutAllDevices"
                          requires:
                            provider_name: access_jwt

                        - match:
                            prefix: "/metaverse.v1.AuthService/Logout"
                          requires:
                            provider_name: access_jwt

                        - match:
                            prefix: "/metaverse.v1.AuthService/Register"
                          requires:
                            allow_missing: {}

                        - match:
                            prefix: "/metaverse.v1.AuthService/Login"
                          requires:
                            allow_missing: {}

                        - match:
                            prefix: "/metaverse.v1.AuthService/Refresh"
                          requires:
                            allow_missing: {}

                        - match:
                            prefix: "/metaverse.v1.HealthService/"
                          requires:
                            allow_missing: {}

                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: grpc_backend
      connect_timeout: 2s
      type: logical_dns
      lb_policy: round_robin
      http2_protocol_options: {}
      load_assignment:
        cluster_name: grpc_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      port_value: 50051

    - name: jwks_cluster
      connect_timeout: 2s
      type: logical_dns
      lb_policy: round_robin
      load_assignment:
        cluster_name: jwks_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      port_value: 8080

admin:
  access_log_path: /tmp/envoy_access.log
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
